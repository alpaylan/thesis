name: LaTeX diff (issue)

# Open an issue titled "latexdiff <base>..<head>" (e.g. "latexdiff v1..HEAD") and
# this builds that diff, publishes it to the `latexdiff-store` branch, and comments
# a viewer link. After the first request creates the branch, set
# Settings -> Pages -> Deploy from a branch -> latexdiff-store / (root).

on:
  issues:
    types: [opened, edited]

jobs:
  diff:
    if: contains(github.event.issue.title, '..')
    uses: alpaylan/latex-diff-viewer/.github/workflows/issue-diff.yml@v1
    permissions:
      contents: write
      issues: write
    with:
      title: ${{ github.event.issue.title }}
      issue_number: ${{ github.event.issue.number }}
      config: difftool.toml
