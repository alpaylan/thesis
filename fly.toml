# Fly.io config for the thesis diff viewer.
# Deploy from the repo root:  fly deploy   (or ./difftool/deploy.sh)
app = "alpaylan-thesis-diff"
primary_region = "iad"

[build]
  dockerfile = "difftool/Dockerfile"

[env]
  # Timestamps (commit dates + diff "created" times) render in this zone.
  TZ = "America/New_York"

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero when idle; wake on the next request (advisor visits rarely).
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2
