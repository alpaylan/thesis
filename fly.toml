# Fly.io config for the thesis diff viewer.
# Deploy from the repo root:  fly deploy   (or ./difftool/deploy.sh)
app = "alpaylan-thesis-diff"
primary_region = "iad"

[build]
  dockerfile = "difftool/Dockerfile"

[env]
  # Timestamps (commit dates + diff "created" times) render in this zone.
  TZ = "America/New_York"

# Persist generated diff/full PDFs + index.json across deploys (build/ is
# otherwise ephemeral and wiped on every redeploy).
[mounts]
  source = "diffs_data"
  destination = "/app/build/diffs"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine always running: builds run in a background thread with no
  # open HTTP connection, so scale-to-zero/suspend would freeze them mid-compile.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2
